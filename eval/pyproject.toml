[project]
name = "pbt-skills-eval"
version = "0.0.1"
description = "Comparison of three PBT generation setups on the same SUT."
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
